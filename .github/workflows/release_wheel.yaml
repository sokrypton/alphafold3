name: Build and release wheel

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bundle_data:
        description: >-
          Bundle libcifpp's components.cif into the wheel. The slim wheel cannot
          import without it (`ImportError: Could not find the libcifpp
          components.cif file`), but bundling takes it from 9 MB to ~250 MB,
          which is over PyPI's 100 MB per-file limit -- so a fat wheel is a
          GitHub release asset only. Built as <version>+data so the filename
          says which one it is.
        type: boolean
        default: false
      release_tag:
        description: "Attach the fat wheels to this release tag (e.g. v3.1.7)"
        type: string
        default: ""

jobs:
  build-wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs_on: ubuntu-latest
            build: "cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
          - name: linux-aarch64
            runs_on: ubuntu-24.04-arm
            build: "cp312-manylinux_aarch64 cp313-manylinux_aarch64 cp314-manylinux_aarch64"
          - name: macos-arm64
            runs_on: macos-14
            build: "cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # SLIM FOR PyPI. `pyproject.toml` deliberately ships the libcifpp data
      # so a source install (and CI's `uv run build_data`) works; with it the
      # wheel is ~250 MB and PyPI's per-file limit is 100 MB. So the exclusion
      # lives here, on the PyPI path only, and the fat build below skips it.
      #
      # python, not `sed -i`: BSD sed on the macOS runner takes the next
      # argument as a backup suffix, so `sed -i` misparses there while working
      # on the Linux runners -- which is how the first fat build failed on
      # macos-arm64 and nowhere else.
      # Editing pyproject.toml leaves the checkout DIRTY, and setuptools_scm
      # renders a dirty tree as a LOCAL version -- `3.1.9.dev0+g7f79c77bd.d20260916`
      # even with the v3.1.8 tag on HEAD. PyPI rejects any local version with
      # `400 The use of local versions ... is not allowed`, which is how v3.1.8
      # built three green platforms and published nothing. So on a tag push,
      # pin the version to the tag before touching the file.
      - name: Slim the wheel for PyPI
        if: ${{ !inputs.bundle_data }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/v}"
              echo "SETUPTOOLS_SCM_PRETEND_VERSION=${v}" >> "$GITHUB_ENV"
              echo "pinned version ${v} from the tag"
              ;;
          esac
          python - <<'EOF'
          import pathlib
          p = pathlib.Path('pyproject.toml')
          t = p.read_text()
          anchor = '    "var/**",'
          assert anchor in t, 'exclude block not in the expected shape'
          assert '"share/**",' not in t, 'share/** already excluded'
          p.write_text(t.replace(anchor, '    "share/**",\n' + anchor, 1))
          print('excluded share/** for the PyPI build')
          EOF

      # FAT, for environments that cannot provision components.cif themselves
      # (the Colab notebook). Built as <version>+data so the filename says
      # which wheel it is -- a fat and a slim wheel with identical names would
      # be a trap worth more than the eight characters it costs to avoid.
      - name: Version the fat wheel
        if: inputs.bundle_data
        run: |
          v=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${v}+data" >> "$GITHUB_ENV"
          echo "bundling libcifpp data; version ${v}+data"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: 1
          # SETUPTOOLS_SCM_PRETEND_VERSION is exported to $GITHUB_ENV by the
          # step above, but cibuildwheel builds Linux wheels INSIDE a manylinux
          # container and the host environment does not follow it in. Without
          # this the fat wheels came out as 3.1.8.dev4+ge07472ed8 -- setuptools_scm
          # falling back to `git describe` inside the container -- instead of
          # 3.1.7+data.
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION

      - name: Upload wheels as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/alphafold3_colabfold-*.whl

  publish:
    needs: [build-wheel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "wheels-*", merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }

  github-release:
    # A fat wheel goes to a GitHub RELEASE, never to PyPI: it is ~250 MB and
    # PyPI's per-file limit is 100 MB. This is how v3.1.5 was distributed, and
    # it is what the Colab notebook installs.
    needs: [build-wheel]
    # `always()`: the first fat build had both Linux legs green and macOS red,
    # and this job was SKIPPED -- so three good wheels were thrown away over an
    # unrelated platform. Upload whatever built; the missing platform is
    # visible from what is attached.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.bundle_data
      && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "wheels-*", merge-multiple: true }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.release_tag }}" \
                 --title "${{ inputs.release_tag }}" \
                 --notes "Wheels with libcifpp's components.cif bundled, for environments that cannot provision it separately (the Colab notebook). The slim wheels of the same version are on PyPI."
          gh release upload "${{ inputs.release_tag }}" dist/*.whl --clobber
